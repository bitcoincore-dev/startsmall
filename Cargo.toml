[package]
name = "startsmall"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
git2 = "0.20"
nostr-sdk = { version = "0.45.1", default-features = false, features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
subtle = "2.6.1"
tiny_http = "0.12"
tokio = { version = "1", features = ["rt-multi-thread"] }
