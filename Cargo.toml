[package]
name = "startsmall"
version = "0.0.3"
description = "A Rust tool that snapshots a Google Sheet into a git repository and optionally serves it as a web page."
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitcoincore-dev/startsmall.git"
homepage = "https://bitcoincore-dev.github.io/startsmall"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
git2 = "0.20"
nostr-sdk = { version = "0.45.1", default-features = false, features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
subtle = "2.6.1"
tiny_http = "0.12"
tokio = { version = "1", features = ["rt-multi-thread"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
